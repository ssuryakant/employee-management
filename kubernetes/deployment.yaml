apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-app

        image: YOUR_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/devops-python-app:1

        ports:
        - containerPort: 5000

        envFrom:
        - configMapRef:
            name: app-config

        - secretRef:
            name: app-db-secret

        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
